<!doctype html>
<html lang="pt-PT">
  <body style="margin:0;padding:0;background:#F2F5F4;font-family:-apple-system,'Plus Jakarta Sans',Helvetica,Arial,sans-serif;color:#0E1F1C;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#F2F5F4;padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:420px;background:#FFFFFF;border:1.5px solid #D6E0DD;border-radius:24px;padding:32px 24px;">
            <tr>
              <td style="font-size:22px;font-weight:800;color:#0B6B5F;padding-bottom:16px;">Patudos</td>
            </tr>
            <tr>
              <td style="font-size:26px;font-weight:800;line-height:1.2;padding-bottom:12px;">O teu código para entrares</td>
            </tr>
            <tr>
              <td style="font-size:17px;line-height:1.45;color:#475A56;padding-bottom:20px;">Escreve este código na app dos Patudos:</td>
            </tr>
            <tr>
              <td align="center" style="background:#D5EEE9;border-radius:16px;padding:20px 8px;font-size:40px;font-weight:800;letter-spacing:10px;color:#0B4F46;">{{ .Token }}</td>
            </tr>
            <tr>
              <td style="font-size:15px;line-height:1.45;color:#475A56;padding-top:20px;">O código é válido durante 1 hora. Se não pediste para entrar, ignora este email.</td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
